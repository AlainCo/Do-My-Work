input_dir: work/input
output_dir: work/output
data_dir: work/data
reference_index:
  max_pdf_bytes: 8388608
  preview_max_text_chars: 1200
  preview_max_lines: 5
translation_review:
  translated_first: false
file_selection:
  default_action: exclude
  rules:
    - match: "**/*.txt"
      action: include
    - match: "**/*.md"
      action: include
    - match: "**/*.references.md"
      action: exclude
    - match: "**/*.index.md"
      action: exclude
resource_selection:
  default_action: exclude
  rules:
    - match: "**/*.url"
      action: include
    - match: "**/*.jpeg"
      action: include
    - match: "**/*.jpg"
      action: include
    - match: "**/*.pdf"
      action: include
spurious_detection:
  default_action: include
  rules:
    - match: "**/*.review.html"
      action: exclude
    - match: "**/*.index.md"
      action: exclude
    - match: "**/*.references.md"
      action: exclude
    - match: ".git/**/*"
      action: exclude
    - match: ".gitignore"
      action: exclude
llm:
  translator:
    technical:
      api: openai
      url: http://127.0.0.1:8000/v1
      model: Ministral-3-3B-Instruct-2512-Q4_K_M
      timeout_seconds: 600.0
      max_retries: 2
      temperature: 0.0
      max_pre_context_bytes: 2400
      max_post_context_bytes: 2400
      max_input_fragment_bytes: 2400
      max_total_text_bytes: 6000
      system_prompt: |
        You are a professional translator from french to english.
      user_prompt: |
        ===BEGIN PREVIOUS CONTEXT===
        ${pre_context}
        ===END PREVIOUS CONTEXT===

        ===BEGIN SOURCE TEXT===
        ${input_fragment}
        ===END SOURCE TEXT===

        ===BEGIN FOLLOWING CONTEXT===
        ${post_context}
        ===END FOLLOWING CONTEXT===
      translated_document_footer: "> ✨ Translated automatically with **Do-My-Work** — a tool designed to make projects speak globally."
      translated_document_header: "> ✨ Translated automatically with **Do-My-Work** — profile: technical."         
